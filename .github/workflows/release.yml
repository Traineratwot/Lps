name: Release

# Pushing a tag like v0.2.0 builds the single-file binary and attaches it
# to a GitHub release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Verify (types + tests)
        run: bun run verify

      - name: Build single-file binary
        run: bun run build

      - name: Prepare artifact
        run: mv dist/lps "dist/lps-linux-x64"

      - name: Create release with binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/lps-linux-x64" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
