      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- indexed program cards inside the search lens -->
  <g transform="translate(30 30) rotate(0)">
    <rect x="-10" y="-11" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="-10" y="-3" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
    <rect x="-10" y="5" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- magnifier -->
